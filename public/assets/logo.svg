<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Camera & Film Reel Emblem -->
  <g transform="translate(15, 12)">
    <!-- Outer Gold Aperture Ring -->
    <circle cx="68" cy="68" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="14 4" opacity="0.85" />
    <circle cx="68" cy="68" r="54" fill="#121212" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Cinematic Shutter Blades -->
    <path d="M68 22 L86 52 L68 52 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M114 68 L84 86 L84 68 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M68 114 L50 84 L68 84 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M22 68 L52 50 L52 68 Z" fill="url(#goldGrad)" opacity="0.75" />
    
    <!-- Center Lens Core -->
    <circle cx="68" cy="68" r="28" fill="#090909" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="68" cy="68" r="14" fill="url(#redGrad)" />
    <!-- Recording Indicator Dot -->
    <circle cx="72" cy="64" r="4" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Film Perforations Accents -->
    <rect x="2" y="58" width="6" height="8" rx="1.5" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="2" y="72" width="6" height="8" rx="1.5" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="128" y="58" width="6" height="8" rx="1.5" fill="url(#goldGrad)" opacity="0.8" />
    <rect x="128" y="72" width="6" height="8" rx="1.5" fill="url(#goldGrad)" opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(165, 0)">
    <!-- Main Title -->
    <text x="0" y="78" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="52" font-weight="800" letter-spacing="4" fill="url(#goldGrad)">
      ADVIKA
    </text>
    
    <!-- Decorative Gold Divider Line with Diamond -->
    <line x1="2" y1="94" x2="410" y2="94" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
    <polygon points="206,90 211,94 206,98 201,94" fill="#E50914" />
    
    <!-- Subtitle: Photo, Film & Graphics -->
    <text x="3" y="118" font-family="'Montserrat', 'Inter', 'Poppins', sans-serif" font-size="14.5" font-weight="600" letter-spacing="5.5" fill="#F5F0E8">
      PHOTO <tspan fill="#E50914">•</tspan> FILM <tspan fill="#E50914">•</tspan> GRAPHICS
    </text>

    <!-- Tagline -->
    <text x="3" y="140" font-family="'Inter', sans-serif" font-size="10.5" font-style="italic" letter-spacing="2" fill="#A3A3A3">
      CAPTURING MOMENTS, CREATING MEMORIES
    </text>
  </g>
</svg>
